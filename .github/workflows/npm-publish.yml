name: NPM publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: yarn

      - name: Unit Test
        run: yarn test

      - name: Build
        run: yarn build

      # Prereleases (e.g. 8.0.0-beta) are published under their own dist-tag, so they never become "latest"
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          echo "tag=$(node -p "require('./package.json').version.match(/-([0-9A-Za-z]+)/)?.[1] ?? 'latest'")" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "Version $version is already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish if version has been updated
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
